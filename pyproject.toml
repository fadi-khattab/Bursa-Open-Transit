[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bursa-open-transit"
version = "0.1.0.dev1"
description = "Development-only civic transit data foundation"
requires-python = ">=3.12"
dependencies = []
license = "Apache-2.0"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
